<!DOCTYPE html>
<html>
<head>
    <title>Monero Trusted Network</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .trusted {
            color: #4CAF50;
        }
        .untrusted {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Monero Trusted Network</h1>
        
        <div class="status">
            <h2>Network Status</h2>
            <p><span class="trusted">✓ 1000 Trusted Seeds</span></p>
            <p><span class="untrusted">✗ All Other Nodes Untrusted</span></p>
            <p>Exclusive network policy active</p>
        </div>
        
        <div id="stats">
            <p>Loading statistics...</p>
        </div>
        
        <div class="info">
            <h3>About This Network</h3>
            <p>This network only trusts 1000 generated seeds. All other Monero nodes are blocked.</p>
        </div>
    </div>
    
    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('stats').innerHTML = `
                    <h3>Statistics</h3>
                    <p>Trusted Seeds: ${data.trusted_seeds || 1000}</p>
                    <p>Untrusted Nodes Blocked: ${data.untrusted_nodes || 0}</p>
                `;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // Load stats on page load
        document.addEventListener('DOMContentLoaded', loadStats);
        // Refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
