version: "3.8"

services:
  monero-trusted-network:
    build: .
    container_name: monero-trusted-network
    restart: unless-stopped
    ports:
      - "${APP_PORT-8080}:8080"
      - "18080:18080"
      - "18089:18089"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
      - "${APP_DATA_DIR}/blockchain:/blockchain"
      - "${APP_DATA_DIR}/tor:/var/lib/tor"
    environment:
      - APP_DATA_DIR=/data
      - UMBREL=1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      - default

networks:
  default:
    driver: bridge
