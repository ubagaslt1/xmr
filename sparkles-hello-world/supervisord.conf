[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid
user=umbrel

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/data/logs/nginx.err.log
stdout_logfile=/data/logs/nginx.out.log
user=root

[program:web]
command=python3 /app/web/app.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/data/logs/web.err.log
stdout_logfile=/data/logs/web.out.log
user=umbrel

[program:monerod]
command=monerod --config-file /data/monerod.conf --data-dir /blockchain --log-file /data/logs/monerod.log
autostart=true
autorestart=true
stderr_logfile=/data/logs/monerod.err.log
stdout_logfile=/data/logs/monerod.out.log
user=umbrel

[program:seed-manager]
command=python3 /app/monitor_network.py --daemon
autostart=true
autorestart=true
stderr_logfile=/data/logs/manager.err.log
stdout_logfile=/data/logs/manager.out.log
user=umbrel

[program:enforcer]
command=python3 /app/enforce_trust.py --daemon
autostart=true
autorestart=true
stderr_logfile=/data/logs/enforcer.err.log
stdout_logfile=/data/logs/enforcer.out.log
user=umbrel
